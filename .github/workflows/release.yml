name: Validate and release HAOS apps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: haos-release-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build_count: ${{ steps.plan.outputs.build_count }}
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet PyYAML
      - name: Validate and discover app manifests
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            python scripts/haos_apps.py plan --event pr --base "origin/$BASE_REF" --output "$GITHUB_OUTPUT"
          else
            python scripts/haos_apps.py plan --event push --base "$BEFORE" --output "$GITHUB_OUTPUT"
          fi
      - name: Test multi-app release planner
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    needs: discover
    if: needs.discover.outputs.build_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} (${{ matrix.arch }})
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ matrix.version }}
          IMAGE_TAG: haos-test:${{ matrix.slug }}-${{ matrix.arch }}
        run: |
          if [[ "$ARCH" == "amd64" ]]; then
            docker buildx build --platform "$PLATFORM" \
              --build-arg "BUILD_ARCH=$ARCH" --build-arg "BUILD_VERSION=$VERSION" \
              --load -t "$IMAGE_TAG" "./$APP"
            if [[ -f "$APP/smoke-test.sh" ]]; then
              IMAGE_TAG="$IMAGE_TAG" bash "$APP/smoke-test.sh"
            fi
          else
            docker buildx build --platform "$PLATFORM" \
              --build-arg "BUILD_ARCH=$ARCH" --build-arg "BUILD_VERSION=$VERSION" \
              --output=type=cacheonly "./$APP"
          fi

  release:
    needs: [discover, build]
    permissions:
      contents: write
    if: >-
      always() && github.event_name == 'push' &&
      needs.discover.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.discover.outputs.releases != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet PyYAML
      - name: Prepare independently versioned app releases
        env:
          RELEASE_APPS: ${{ needs.discover.outputs.releases }}
        run: |
          python scripts/haos_apps.py release --apps-json "$RELEASE_APPS" --tags-output "$RUNNER_TEMP/haos-tags"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)*/config.yaml' ':(glob)*/CHANGELOG.md'
          git diff --cached --check
          git diff --cached --quiet && { echo "No release files changed"; exit 1; }
          git commit -m "chore(release): update HAOS app versions"
          refs=("HEAD:refs/heads/main")
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            git tag -a "$tag" -m "Release $tag"
            refs+=("refs/tags/$tag")
          done < "$RUNNER_TEMP/haos-tags"
          git push --atomic origin "${refs[@]}"
