name: Test and release HAOS app

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: haos-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration and bump patch version
        shell: bash
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          import yaml

          for file in ("repository.yaml", "openai_tunnel/config.yaml"):
              data = yaml.safe_load(Path(file).read_text())
              assert isinstance(data, dict), f"{file}: expected a YAML mapping"

          with open("cliff.toml", "rb") as f:
              tomllib.load(f)

          path = Path("openai_tunnel/config.yaml")
          content = path.read_text()
          match = re.search(r'^version: "(\d+)\.(\d+)\.(\d+)"$', content, re.M)
          assert match, "Expected a three-part app version"

          major, minor, patch = map(int, match.groups())
          version = f"{major}.{minor}.{patch + 1}"
          path.write_text(content.replace(match.group(0), f'version: "{version}"', 1))

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VERSION={version}\n")
          PY

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test amd64
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION="$VERSION" \
            --load -t ha-openai-tunnel:amd64 ./openai_tunnel
          docker run --rm --entrypoint nginx ha-openai-tunnel:amd64 -t
          docker run --rm --entrypoint /usr/local/bin/tunnel-client \
            ha-openai-tunnel:amd64 --version

      - name: Build aarch64
        shell: bash
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg BUILD_ARCH=aarch64 \
            --build-arg BUILD_VERSION="$VERSION" \
            --output=type=cacheonly ./openai_tunnel

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.1

      - name: Generate changelog
        shell: bash
        run: |
          if [[ -f openai_tunnel/CHANGELOG.md ]]; then
            git cliff --config cliff.toml --unreleased \
              --tag "v$VERSION" \
              --prepend openai_tunnel/CHANGELOG.md
          else
            git cliff --config cliff.toml --unreleased \
              --tag "v$VERSION" \
              --output openai_tunnel/CHANGELOG.md
          fi
          test -s openai_tunnel/CHANGELOG.md

      - name: Commit release and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openai_tunnel/config.yaml openai_tunnel/CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
