name: Validate OAuth test add-on

on:
  pull_request:
    branches: [main]
    paths:
      - "openai_tunnel_oauth/**"
      - ".github/workflows/oauth-ci.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HAOS metadata
        shell: bash
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path("openai_tunnel_oauth/config.yaml").read_text())
          assert cfg["slug"] == "openai_tunnel_oauth"
          assert cfg["homeassistant_api"] is False
          assert "MCP_EXTRA_HEADERS" not in cfg.get("options", {})
          assert cfg["options"]["HA_OAUTH_ORIGIN"] == "http://dawnha.local"
          assert "MCP_SERVER_URL" not in cfg["options"]
          assert cfg["schema"]["MCP_SERVER_URL"] == "str?"
          nginx = Path("openai_tunnel_oauth/ingress.conf").read_text()
          assert "listen 127.0.0.1:__HA_LISTEN_PORT__;" in nginx
          assert "location = /auth/token" in nginx
          assert "location = /auth/revoke" in nginx
          assert "http://supervisor" not in nginx
          dockerfile = Path("openai_tunnel_oauth/Dockerfile").read_text()
          assert "oauth-setup.sh" in dockerfile
          assert "dawnha.local" not in dockerfile
          assert "dawnha.local" not in nginx
          print("OAuth app metadata and isolation: OK")
          PY

      - uses: docker/setup-buildx-action@v3

      - name: Build and validate Nginx and startup diagnostic
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION=0.1.10 \
            --load -t ha-openai-tunnel-oauth:ci ./openai_tunnel_oauth
          docker run --rm --add-host homeassistant:127.0.0.1 \
            -e HA_OAUTH_ORIGIN=http://example.local:8123 \
            -e MCP_SERVER_URL=http://127.0.0.1:8098/mcp \
            --entrypoint sh ha-openai-tunnel-oauth:ci -ec \
            '. /usr/local/bin/oauth-setup.sh; nginx -t; grep -q "127.0.0.1:8123" /etc/nginx/http.d/default.conf; grep -q "Host example.local:8123" /etc/nginx/http.d/default.conf'
          docker run --rm --add-host homeassistant:127.0.0.1 \
            -e HA_OAUTH_ORIGIN=https://example.ts.net \
            --entrypoint sh ha-openai-tunnel-oauth:ci -ec \
            '. /usr/local/bin/oauth-setup.sh; nginx -t; grep -q "127.0.0.1:8098" /etc/nginx/http.d/default.conf; grep -q "Host example.ts.net:443;" /etc/nginx/http.d/default.conf; test "$MCP_OAUTH_TRUSTED_ORIGINS" = "https://example.ts.net"'
          docker run --rm --add-host homeassistant:127.0.0.1 \
            -e HA_OAUTH_ORIGIN=https://example.ts.net:8443 \
            --entrypoint sh ha-openai-tunnel-oauth:ci -ec \
            '. /usr/local/bin/oauth-setup.sh; nginx -t; grep -q "Host example.ts.net:8443;" /etc/nginx/http.d/default.conf'
          if docker run --rm -e HA_OAUTH_ORIGIN=http://bad.local/path \
            --entrypoint sh ha-openai-tunnel-oauth:ci -ec '. /usr/local/bin/oauth-setup.sh'; then
            echo 'Invalid origin was accepted'; exit 1
          fi
          docker run --rm --entrypoint sh \
            ha-openai-tunnel-oauth:ci -n /usr/local/share/oauth-diagnostic.sh
          docker run --rm --entrypoint sh \
            ha-openai-tunnel-oauth:ci -n /usr/local/bin/oauth-setup.sh
          docker run --rm --entrypoint /usr/local/bin/tunnel-client \
            ha-openai-tunnel-oauth:ci --version
