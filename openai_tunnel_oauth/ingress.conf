# Experimental OAuth endpoint: separate HAOS add-on and separate OpenAI tunnel.
# This listener is only reachable by the local tunnel-client process.
# Do not log request headers, query strings, or bearer token values.
log_format tunnel_mcp_safe '$time_iso8601 oauth_mcp "$request_method $uri" '
                           'status=$status upstream=$upstream_status '
                           'duration=$request_time upstream_duration=$upstream_response_time';

server {
    listen 127.0.0.1:8098;
    server_name localhost;
    access_log /dev/stdout tunnel_mcp_safe;
    error_log /dev/stderr warn;

    # HA uses the request's Host to select its configured internal/external
    # URL and produce absolute OAuth discovery URLs.
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://homeassistant/.well-known/oauth-protected-resource;
        proxy_set_header Host dawnha.local;
        proxy_set_header Authorization "";
        proxy_set_header X-Ha-Access "";
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass http://homeassistant/.well-known/oauth-protected-resource;
        proxy_set_header Host dawnha.local;
        proxy_set_header Authorization "";
        proxy_set_header X-Ha-Access "";
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://homeassistant/.well-known/oauth-authorization-server;
        proxy_set_header Host dawnha.local;
        proxy_set_header Authorization "";
        proxy_set_header X-Ha-Access "";
    }

    # Preserve the user's OAuth bearer token; never substitute a Supervisor
    # credential. HA Core performs authentication and user attribution.
    location = /mcp {
        proxy_pass http://homeassistant/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host dawnha.local;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Ha-Access "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}

# Home Assistant Ingress continues using the separate port 8099 below.
server {
    listen 127.0.0.1:8098;
    server_name localhost;
    access_log /dev/stdout tunnel_mcp_safe;
    error_log /dev/stderr warn;

    # tunnel-client v0.0.20 considers an all-404 OAuth metadata lookup optional.
    # Supervisor currently returns non-JSON error text at these paths, which
    # otherwise prevents the tunnel's control-plane polling from starting.
    location ^~ /.well-known/ {
        # tunnel-client v0.0.20 treats 404 discovery as optional only when
        # it has not parsed an invalid response body. Serve a truly empty
        # 404 via an internal zero-byte file, not nginx's HTML error page.
        error_page 404 =404 /_oauth_empty;
        return 404;
    }

    location = /_oauth_empty {
        internal;
        default_type application/json;
        alias /etc/nginx/oauth-empty;
    }

    location = /mcp {
        proxy_pass http://supervisor/core/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host supervisor;
        proxy_set_header Connection "";
        proxy_set_header X-Ha-Access $http_x_ha_access;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}

# Home Assistant Ingress forwards authenticated requests from Supervisor.
server {
    listen 8099;
    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_buffering off;

        # The upstream UI assumes it runs at /. Ingress uses a changing prefix.
        # Rewrite root-relative HTML assets and JS fetch/EventSource URLs.
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'href="/assets/' 'href="assets/';
        sub_filter 'src="/assets/' 'src="assets/';
        sub_filter '"/api/' '"api/';
        sub_filter '`/api/' '`api/';
        sub_filter '"/health' '"health';
        sub_filter '"/readyz' '"readyz';
        sub_filter '"/metrics' '"metrics';
    }
}
