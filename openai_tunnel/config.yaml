name: OpenAI Secure MCP Tunnel
version: "0.1.0"
slug: openai_tunnel
description: Outbound-only OpenAI MCP tunnel with private Home Assistant Ingress UI
url: https://github.com/fowl2-bot/ha-openai-tunnel
arch:
  - amd64
  - aarch64
legacy: true
ingress: true
ingress_port: 8099
ingress_entry: /
ingress_stream: true
panel_admin: true
stage: experimental
panel_icon: mdi:connection
panel_title: MCP Tunnel
homeassistant_api: true
init: false
startup: application
boot: manual
options:
  CONTROL_PLANE_TUNNEL_ID: null
  MCP_SERVER_URL: http://supervisor/core/api/mcp
  MCP_EXTRA_HEADERS: "X-Ha-Access: env:SUPERVISOR_TOKEN"
  LOG_LEVEL: info
  LOG_FORMAT: struct-text
schema:
  CONTROL_PLANE_TUNNEL_ID: str
  CONTROL_PLANE_API_KEY: password
  MCP_SERVER_URL: str
  MCP_EXTRA_HEADERS: str
  LOG_LEVEL: list(debug|info|warn|error)
  LOG_FORMAT: list(struct-text|json)
