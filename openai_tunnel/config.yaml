name: OpenAI Secure MCP Tunnel
version: "v0.0.21"
slug: openai_tunnel
description: Outbound-only OpenAI MCP tunnel using the official OpenAI image
url: https://github.com/fowl2-bot/ha-openai-tunnel
arch:
  - amd64
  - aarch64
image: ghcr.io/openai/tunnel-client
legacy: true
homeassistant_api: true
init: true
startup: application
boot: manual
options:
  CONTROL_PLANE_TUNNEL_ID: null
  MCP_SERVER_URL: http://supervisor/core/api/mcp
  MCP_EXTRA_HEADERS: "X-Ha-Access: env:SUPERVISOR_TOKEN"
  LOG_LEVEL: info
  LOG_FORMAT: struct-text
schema:
  CONTROL_PLANE_TUNNEL_ID: str
  CONTROL_PLANE_API_KEY: password
  MCP_SERVER_URL: str
  MCP_EXTRA_HEADERS: str
  LOG_LEVEL: list(debug|info|warn|error)
  LOG_FORMAT: list(struct-text|json)
