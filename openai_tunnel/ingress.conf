# Home Assistant Ingress forwards authenticated requests from Supervisor.
server {
    listen 8099;
    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_buffering off;

        # The upstream UI assumes it runs at /. Ingress uses a changing prefix.
        # Rewrite root-relative HTML assets and JS fetch/EventSource URLs.
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'href="/assets/' 'href="assets/';
        sub_filter 'src="/assets/' 'src="assets/';
        sub_filter '"/api/' '"api/';
        sub_filter '`/api/' '`api/';
        sub_filter '"/health' '"health';
        sub_filter '"/readyz' '"readyz';
        sub_filter '"/metrics' '"metrics';
    }
}
